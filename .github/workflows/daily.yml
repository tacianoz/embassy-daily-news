name: Atualização diária do dashboard

on:
  # Disparo principal: agendador externo (cron-job.org) via API às 00:30 UTC
  # (06:00 em Nova Délhi) — pontual (token expira 30/12/2026).
  # GARANTIA: o schedule nativo do GitHub roda MAIS TARDE e SÓ gera edição se
  # a das 06:00 não tiver saído (ver passo "Garantia" abaixo). Nominal 06:30
  # IST; com o atraso típico do GitHub (~3h20), age por volta das 9h-10h IST.
  schedule:
    - cron: "0 1 * * *"     # garantia: só builda se a edição do dia faltar
  workflow_dispatch:        # disparo diário (cron-job.org) e execução manual
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/daily.yml"

# Permissões: publicar no GitHub Pages + versionar o histórico de 3 dias
permissions:
  contents: write
  pages: write
  id-token: write

# Garante uma publicação por vez
concurrency:
  group: "pages"
  cancel-in-progress: false

# Node 24: a partir de 16/jun/2026 o GitHub força as actions JS a rodar em
# Node 24; opta agora para validar antes do prazo.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      built: ${{ steps.guard.outputs.skip != 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # O cron do GitHub é só GARANTIA: se a edição de hoje (data de Nova
      # Délhi) já foi publicada pelo cron-job.org, não há o que fazer.
      # Disparos manuais e por push sempre geram edição.
      - name: Garantia — pula se a edição do dia já saiu
        id: guard
        if: github.event_name == 'schedule'
        run: |
          TODAY=$(TZ=Asia/Kolkata date +%F)
          if [ -f "history/data-$TODAY.json" ]; then
            echo "Edição de $TODAY já publicada — garantia dispensada."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Edição de $TODAY ainda não existe — gerando pela garantia."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Gerar dashboard
        if: steps.guard.outputs.skip != 'true'
        run: python3 scripts/build.py
        env:
          OUTPUT_DIR: public
          # Camada de IA opcional. Sem a secret, o build usa só o ranking
          # heurístico (fallback automático).
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.6-flash
          # Narrativas: sem override, o build escolhe automaticamente o melhor
          # modelo Pro disponível na conta (consulta a lista de modelos da API)
          # Opcional (APIs pagas): com UMA destas secrets, as Narrativas usam
          # um modelo de ponta — Claude Opus 4.8 (Anthropic) ou GPT-5.6 Sol
          # (OpenAI). Sem elas, continuam no Gemini (grátis). Se ambas
          # existirem, a Anthropic tem prioridade.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      # Persiste os snapshots de history/ para que o menu de 3 dias (Hoje /
      # Ontem / Anteontem) sobreviva entre execuções. Não falha o build se o
      # push não rolar (ex.: concorrência) — history/ não dispara o workflow.
      - name: Persistir histórico (3 dias)
        if: steps.guard.outputs.skip != 'true'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history/
          git diff --cached --quiet || git commit -m "Histórico: snapshot diário do dashboard"
          git push

      - name: Configurar Pages
        if: steps.guard.outputs.skip != 'true'
        uses: actions/configure-pages@v5

      - name: Enviar artefato
        if: steps.guard.outputs.skip != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    if: needs.build.outputs.built == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
