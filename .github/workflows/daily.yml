name: Atualização diária do dashboard

on:
  schedule:
    # 01:43 UTC = 07:13 em Nova Délhi (IST, UTC+5:30) — toda manhã na Índia.
    # Minuto "quebrado" de propósito: horários redondos (:00/:30) concentram
    # jobs no GitHub e têm mais chance de ser atrasados ou pulados.
    - cron: "43 1 * * *"
    # Redundância: se o disparo acima for pulado pelo GitHub, este cobre.
    - cron: "13 2 * * *"
  workflow_dispatch:        # permite rodar manualmente pela aba Actions
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/daily.yml"

# Permissões necessárias para publicar no GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Garante uma publicação por vez
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerar dashboard
        run: python3 scripts/build.py
        env:
          OUTPUT_DIR: public
          # Camada de IA opcional. Sem a secret, o build usa só o ranking
          # heurístico (fallback automático).
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
