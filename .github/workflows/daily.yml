name: Atualização diária do dashboard

on:
  # Disparo diário é feito por um agendador externo (cron-job.org) via API,
  # chamando este workflow_dispatch — não usamos o schedule do GitHub porque
  # ele atrasa/pula com frequência.
  workflow_dispatch:        # disparo diário (cron-job.org) e execução manual
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/daily.yml"

# Permissões necessárias para publicar no GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Garante uma publicação por vez
concurrency:
  group: "pages"
  cancel-in-progress: false

# Node 24: a partir de 16/jun/2026 o GitHub força as actions JS a rodar em
# Node 24; opta agora para validar antes do prazo.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Gerar dashboard
        run: python3 scripts/build.py
        env:
          OUTPUT_DIR: public
          # Camada de IA opcional. Sem a secret, o build usa só o ranking
          # heurístico (fallback automático).
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
