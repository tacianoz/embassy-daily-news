name: Atualização diária do dashboard

# Este workflow funciona "de fábrica" em qualquer cópia do repositório (veja
# INSTALAR.md): basta ativar o GitHub Pages (Source: GitHub Actions) e,
# opcionalmente, cadastrar a secret GEMINI_API_KEY.
on:
  # Agendamento nativo do GitHub: 01:00 UTC (06:30 em Nova Délhi, 22:00 em
  # Brasília). O GitHub costuma atrasar crons em 1-3 h. Quem quiser
  # pontualidade pode disparar o workflow_dispatch por um agendador externo
  # (ex.: cron-job.org via API) — nesse caso o passo "Garantia" evita uma
  # segunda edição no mesmo dia.
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:        # execução manual (Actions → Run workflow)
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/daily.yml"

# Permissões: publicar no GitHub Pages + versionar o histórico de 3 dias
permissions:
  contents: write
  pages: write
  id-token: write

# Garante uma publicação por vez
concurrency:
  group: "pages"
  cancel-in-progress: false

# Node 24: a partir de 16/jun/2026 o GitHub força as actions JS a rodar em
# Node 24; opta agora para validar antes do prazo.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      built: ${{ steps.guard.outputs.skip != 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Verificação amigável ANTES de gastar tempo com o build: o GitHub não
      # permite que o próprio workflow ative o Pages, então esse é o único
      # passo manual da instalação. Se faltar, falha com instruções claras.
      - name: Verificar se o GitHub Pages está ativado
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SETTINGS="https://github.com/$GITHUB_REPOSITORY/settings/pages"
          if ! BUILD_TYPE=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type' 2>/dev/null); then
            echo "::error::GitHub Pages ainda não está ativado. Abra $SETTINGS, em 'Build and deployment → Source' escolha 'GitHub Actions' e rode este workflow de novo (Actions → Run workflow)."
            exit 1
          fi
          if [ "$BUILD_TYPE" != "workflow" ]; then
            echo "::error::GitHub Pages está configurado como '$BUILD_TYPE'. Abra $SETTINGS e mude 'Source' para 'GitHub Actions'; depois rode o workflow de novo."
            exit 1
          fi
          echo "GitHub Pages ativado (Source: GitHub Actions) ✔"

      # Cópias criadas a partir do modelo ("Use this template") herdam os
      # snapshots do repositório original. Na primeira execução em um
      # repositório novo, descarta esse histórico para o menu Hoje/Ontem/
      # Anteontem começar limpo. O marcador history/.repo identifica o dono.
      - name: Primeira execução — descarta histórico herdado do modelo
        run: |
          mkdir -p history
          if [ -f history/.repo ] && [ "$(cat history/.repo)" != "$GITHUB_REPOSITORY" ]; then
            echo "Histórico herdado de $(cat history/.repo) — descartando snapshots."
            rm -f history/data-*.json
          fi
          echo "$GITHUB_REPOSITORY" > history/.repo

      # O cron do GitHub é só GARANTIA: se a edição de hoje (data de Nova
      # Délhi) já foi publicada por um disparo externo, não há o que fazer.
      # Sem agendador externo, o cron gera a edição do dia normalmente.
      # Disparos manuais e por push sempre geram edição.
      - name: Garantia — pula se a edição do dia já saiu
        id: guard
        if: github.event_name == 'schedule'
        run: |
          TODAY=$(TZ=Asia/Kolkata date +%F)
          if [ -f "history/data-$TODAY.json" ]; then
            echo "Edição de $TODAY já publicada — garantia dispensada."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Edição de $TODAY ainda não existe — gerando pela garantia."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Gerar dashboard
        if: steps.guard.outputs.skip != 'true'
        run: python3 scripts/build.py
        env:
          OUTPUT_DIR: public
          # Camada de IA opcional. Sem a secret, o build usa só o ranking
          # heurístico (fallback automático).
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.6-flash
          # Narrativas: sem override, o build escolhe automaticamente o melhor
          # modelo Pro disponível na conta (consulta a lista de modelos da API)
          # Opcional (APIs pagas): com UMA destas secrets, as Narrativas usam
          # um modelo de ponta — Claude Opus 4.8 (Anthropic) ou GPT-5.6 Sol
          # (OpenAI). Sem elas, continuam no Gemini (grátis). Se ambas
          # existirem, a Anthropic tem prioridade.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      # Persiste os snapshots de history/ para que o menu de 3 dias (Hoje /
      # Ontem / Anteontem) sobreviva entre execuções. Não falha o build se o
      # push não rolar (ex.: concorrência) — history/ não dispara o workflow.
      - name: Persistir histórico (3 dias)
        if: steps.guard.outputs.skip != 'true'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history/
          git diff --cached --quiet || git commit -m "Histórico: snapshot diário do dashboard"
          git push

      - name: Configurar Pages
        if: steps.guard.outputs.skip != 'true'
        uses: actions/configure-pages@v5

      - name: Enviar artefato
        if: steps.guard.outputs.skip != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    if: needs.build.outputs.built == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
