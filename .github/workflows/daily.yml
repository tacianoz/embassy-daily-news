name: Atualização diária do dashboard

on:
  # Disparo principal: agendador externo (cron-job.org) via API, chamando este
  # workflow_dispatch — é pontual, mas depende de um token que pode expirar.
  # Por isso mantemos TAMBÉM o schedule nativo do GitHub como REDE DE SEGURANÇA:
  # ele não usa token e nunca expira (pode atrasar/pular ocasionalmente, mas
  # garante que o painel não congele se o gatilho externo falhar).
  schedule:
    - cron: "30 0 * * *"    # 00:30 UTC diário (backup sem token)
  workflow_dispatch:        # disparo diário (cron-job.org) e execução manual
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/daily.yml"

# Permissões: publicar no GitHub Pages + versionar o histórico de 3 dias
permissions:
  contents: write
  pages: write
  id-token: write

# Garante uma publicação por vez
concurrency:
  group: "pages"
  cancel-in-progress: false

# Node 24: a partir de 16/jun/2026 o GitHub força as actions JS a rodar em
# Node 24; opta agora para validar antes do prazo.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Gerar dashboard
        run: python3 scripts/build.py
        env:
          OUTPUT_DIR: public
          # Camada de IA opcional. Sem a secret, o build usa só o ranking
          # heurístico (fallback automático).
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.6-flash

      # Persiste os snapshots de history/ para que o menu de 3 dias (Hoje /
      # Ontem / Anteontem) sobreviva entre execuções. Não falha o build se o
      # push não rolar (ex.: concorrência) — history/ não dispara o workflow.
      - name: Persistir histórico (3 dias)
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history/
          git diff --cached --quiet || git commit -m "Histórico: snapshot diário do dashboard"
          git push

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
